global:
  scrape_interval:     15s   # How often to scrape
  evaluation_interval: 15s   # How often to evaluate rules

# Scrape the bootstrap node's Prometheus metrics endpoint
# Bootstrap exposes: GET http://VM_IP:9090/metrics
scrape_configs:
  - job_name: ridechain_bootstrap_prod
    static_configs:
      - targets: ["host.docker.internal:9090"]
        labels:
          env: prod
          service: bootstrap
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: "bootstrap-prod-1"

  # Add more bootstrap nodes here for multi-node setups:
  # - job_name: ridechain_bootstrap_prod_2
